name: CI
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Required for OIDC token
permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Re-use node_modules between runs until package.json or package-lock.json changes.
      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package.json', 'package-lock.json') }}

      # Re-use ~/.elm between runs until elm.json or elm-tooling.json changes.
      # The Elm compiler saves downloaded Elm packages there, and elm-tooling
      # saves downloaded tool executables there.
      - name: Cache ~/.elm
        uses: actions/cache@v6
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json', 'elm-tooling.json') }}

      # `npm ci` removes node_modules before running, so skip it when the cache
      # was restored. NO_ELM_TOOLING_INSTALL turns the postinstall script into a
      # no-op — the next step handles that, since elm-tooling.json and
      # package-lock.json can change independently.
      - name: Install npm packages
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        env:
          NO_ELM_TOOLING_INSTALL: 1
        run: npm ci --no-audit

      # Always run, to be sure node_modules/.bin has links to every tool. It is
      # fast when there is nothing new to download.
      - name: Install tools from elm-tooling.json
        run: npx elm-tooling install

      - name: Run Tests
        run: npx elm-test-rs tests/* >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Cache ~/.elm
        uses: actions/cache@v6
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json', 'elm-tooling.json') }}

      - name: Install npm packages
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        env:
          NO_ELM_TOOLING_INSTALL: 1
        run: npm ci --no-audit

      - name: Install tools from elm-tooling.json
        run: npx elm-tooling install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-elm-sudoku-prod-deploy
          aws-region: ${{ vars.AWS_REGION }}

      # Output must match the <script src> in index.html and the "output" in
      # elm-watch.json, so local dev and prod load the same path.
      - name: Build
        run: npx elm make --optimize src/Main.elm --output build/main.js

      - name: Deploy to website
        run: |
          aws s3 cp index.html s3://${{ vars.S3_BUCKET }}${{ vars.S3_BUCKET_PATH }}
          aws s3 cp build/main.js s3://${{ vars.S3_BUCKET }}${{ vars.S3_BUCKET_PATH }}build/main.js

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths '${{ vars.S3_BUCKET_PATH }}*'
